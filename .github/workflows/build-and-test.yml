name: Build and Test

# Every pull request and every push to the main branches builds the app,
# runs the full CTest suite (including the document-integrity gates) and a
# bounded launch smoke test. A failing test fails the workflow; a
# successful app launch cannot hide it.
on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (tests + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-svg-dev \
            qt6-pdf-dev \
            libgl1-mesa-dev \
            xvfb

      - name: Configure (with tests)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build app and tests
        run: cmake --build build --parallel "$(nproc)"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build --output-on-failure --timeout 300 \
            --output-junit ctest-results.xml

      - name: Launch smoke test
        run: |
          set -u
          # The app must still be running after 10 s: `timeout` then stops
          # it with exit code 124. Any other status means it exited or
          # crashed on its own. HOME is isolated so no stale settings or
          # recovery snapshots can open modal dialogs.
          export HOME="$(mktemp -d)"
          set +e
          timeout --signal=TERM --kill-after=5 10 \
            xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
            ./build/FullScreen-Pencil-Draw > build/app_output.log 2>&1
          status=$?
          set -e
          echo "Application exit status: $status"
          cat build/app_output.log
          if [ "$status" -ne 124 ]; then
            echo "::error::The application exited early (status $status)."
            exit 1
          fi

      - name: Upload test and app logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-logs
          path: |
            build/ctest-results.xml
            build/Testing/Temporary/LastTest.log
            build/app_output.log
          if-no-files-found: ignore

  platforms:
    name: ${{ matrix.os }} (tests)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Informational until the suite has a track record on these runners;
    # the Linux job above is the required gate.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            qt_arch: clang_64
          - os: windows-latest
            qt_arch: win64_msvc2022_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.2
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Configure (with tests)
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build app and tests
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: Run tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build -C Release --output-on-failure --timeout 300 \
            --output-junit ctest-results.xml

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-test-logs
          path: |
            build/ctest-results.xml
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
